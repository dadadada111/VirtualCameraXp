name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: List build outputs
      run: |
        echo "=== 查找 APK 文件 ==="
        find app/build/outputs -name "*.apk" -type f || echo "未找到 APK 文件"
        echo ""
        echo "=== app/build/outputs 目录结构 ==="
        ls -la app/build/outputs/ || echo "目录不存在"
        echo ""
        echo "=== app/build/outputs/apk 目录结构 ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "目录不存在"
        echo ""
        echo "=== app/build/outputs/apk/release 目录结构 ==="
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "目录不存在"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        retention-days: 30
